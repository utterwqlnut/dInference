[package]
name = "dinference"
version = "0.1.0"
description = "dInference — decentralized LLM inference marketplace with activation-fingerprint verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dinference"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
